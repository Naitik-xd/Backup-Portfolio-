<!DOCTYPE html>
<html>
<head>
  <style>
    :root {
      --surface: #111627;
      --color-surface: var(--surface);
    }
    body.light-mode {
      --surface: #ffffff;
    }
    .bg-surface {
      background-color: var(--color-surface);
    }
  </style>
</head>
<body class="light-mode">
  <div class="bg-surface" style="width:100px; height:100px; border:1px solid red;"></div>
</body>
</html>
